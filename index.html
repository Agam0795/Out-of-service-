<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shivani Taxi Services - Under Maintenance</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    color:white;
}
.container{
    text-align:center;
    max-width:650px;
    padding:50px;
    background:rgba(255,255,255,0.1);
    border-radius:20px;
    backdrop-filter:blur(10px);
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}
.icon{
    font-size:90px;
    margin-bottom:20px;
}
h1{
    font-size:3rem;
    margin-bottom:20px;
}
p{
    font-size:1.1rem;
    line-height:1.8;
    color:#e5e7eb;
}
.loader{
    width:60px;
    height:60px;
    border:6px solid rgba(255,255,255,0.2);
    border-top:6px solid #fff;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:30px auto;
}
@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}
.footer{
    margin-top:30px;
    color:#cbd5e1;
    font-size:14px;
}
.contact{
    margin-top:20px;
    font-size:16px;
    color:#ffffff;
}
.contact a{
    color:#93c5fd;
    text-decoration:none;
}
.contact a:hover{
    text-decoration:underline;
}
</style>
</head>
<body>
<div class="container">
    <div class="icon">🚕</div>
    <h1>Website Under Maintenance</h1>
    <p>
        Our website is temporarily unavailable as we are upgrading our services
        to provide a better experience.
    </p>
    <div class="loader"></div>
    <p>
        We apologize for the inconvenience and appreciate your patience.
        Please visit again soon.
    </p>
    <div class="footer">
        © 2026 Shivani Taxi Services. All Rights Reserved.
    </div>
</div>
</body>
</html>
